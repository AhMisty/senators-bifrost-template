name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install
        run: npm install
      - name: Check
        run: npm run check
      - name: Check package
        run: npm run test:package
      - name: The checks changed nothing
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
